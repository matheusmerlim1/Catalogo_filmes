<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes e Séries</title>
    <link rel="stylesheet" href="styles.css">
    <script src="css/script.js" defer></script>

</head>
<body>
    <header>
        <h1>Catálogo de Filmes e Séries</h1>
    </header>
    <main id="catalogo">
        <!-- Os cards serão inseridos dinamicamente aqui -->
    </main>
<!-- === Botao de volta ao portfolio - cole antes de </body> === -->
<a id="mr-portfolio-btn" href="https://matheusmerlim1.github.io/" target="_blank" rel="noopener"
   aria-label="Abrir o portf&oacute;lio de Matheus Raposo" title="Ver todos os meus projetos">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>
  </svg>
  <span>Portf&oacute;lio</span>
</a>
<style>
#mr-portfolio-btn {
  position: fixed; top: 12px; right: 12px; z-index: 2147483000;
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .42rem .8rem; border-radius: 999px;
  font: 600 13px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #e8edf5; text-decoration: none; white-space: nowrap;
  background: rgba(18,24,38,.92);
  border: 1px solid rgba(88,166,255,.45);
  box-shadow: 0 2px 12px rgba(0,0,0,.35);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  transition: transform .15s, border-color .15s, background .15s;
}
#mr-portfolio-btn:hover {
  transform: translateY(-1px); color: #fff; text-decoration: none;
  background: rgba(24,32,50,.96); border-color: #58a6ff;
}
#mr-portfolio-btn:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
@media (max-width: 520px) {
  #mr-portfolio-btn { padding: .45rem; }
  #mr-portfolio-btn span { display: none; }
}
@media print { #mr-portfolio-btn { display: none; } }
</style>
<!-- === fim do botao === -->
</body>
</html>
